<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOS History | SafeHer</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">S</span><div><strong>SafeHer</strong><small>Emergency Safety</small></div></div><div class="top-actions"><a class="secondary" href="portal.html">Dashboard</a><a class="secondary" href="trusted-contacts.html">Trusted Contacts</a><a class="secondary" href="profile.html">Profile</a><button class="secondary" onclick="logout()">Logout</button></div></header><main class="container"><section class="panel"><p class="eyebrow">YOUR RECORDS</p><h2>SOS History</h2><div id="history"></div></section></main><script src="api.js"></script><script>requireAuth().then(async()=>{const a=(await api('/api/sos/history')).alerts;history.innerHTML=a.length?a.map(x=>`<div class="card"><h3>SOS Incident</h3><p><b>${new Date(x.activatedAt).toLocaleString('en-ZA')}</b><br>Deactivated: ${x.deactivatedAt?new Date(x.deactivatedAt).toLocaleString('en-ZA'):'—'}<br>Status: ${x.status}<br>Coordinates: ${x.latitude.toFixed(5)}, ${x.longitude.toFixed(5)}</p><a class="secondary" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${x.latitude},${x.longitude}">View Map</a></div>`).join(''):'<div class="card">No SOS incidents yet.</div>';});</script></body></html>
