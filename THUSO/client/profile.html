<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | SafeHer</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div class="brand"><span class="brand-mark">S</span><div><strong>SafeHer</strong><small>Emergency Safety</small></div></div><div class="top-actions"><a class="secondary" href="portal.html">Dashboard</a><a class="secondary" href="trusted-contacts.html">Trusted Contacts</a><button class="secondary" onclick="logout()">Logout</button></div></header><main class="container"><section class="panel"><p class="eyebrow">ACCOUNT</p><h2>Profile</h2><form id="profileForm"><div class="form-group"><label>Full name</label><input id="fullName" required></div><div class="form-group"><label>Email</label><input id="email" type="email" required></div><div class="form-group"><label>Phone</label><input id="phone" required></div><div id="pmsg" class="message"></div><button class="primary">Save Profile</button></form></section><section class="panel"><h2>Change Password</h2><form id="passwordForm"><div class="form-group"><label>Current password</label><input id="currentPassword" type="password" required></div><div class="form-group"><label>New password</label><input id="newPassword" type="password" minlength="8" required></div><div id="pwmsg" class="message"></div><button class="primary">Change Password</button></form></section></main><script src="api.js"></script><script src="profile.js"></script></body></html>
