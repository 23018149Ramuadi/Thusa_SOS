<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trusted Contacts | SafeHer</title><link rel="stylesheet" href="style.css"></head><body><div id="toast" class="toast"></div><header class="topbar"><div class="brand"><span class="brand-mark">S</span><div><strong>SafeHer</strong><small>Emergency Safety</small></div></div><div class="top-actions"><a class="secondary" href="portal.html">Dashboard</a><a class="secondary" href="sos-history.html">SOS History</a><a class="secondary" href="profile.html">Profile</a><button class="secondary" onclick="logout()">Logout</button></div></header><main class="container"><section class="panel"><div class="panel-head"><div><p class="eyebrow">SAFETY NETWORK</p><h2>Trusted Contacts</h2><p>These contacts are linked only to your account.</p></div><div><span id="count" class="status-pill neutral">0 / 2 Trusted Contacts Added</span> <button id="addBtn" class="primary">Add Trusted Contact</button></div></div><div id="contacts" class="grid-3"></div></section><section id="formCard" class="panel hidden"><h2 id="formTitle">Add Trusted Contact</h2><form id="contactForm"><input type="hidden" id="contactId"><div class="form-group"><label>Full name</label><input id="name" required></div><div class="form-group"><label>Relationship</label><input id="relationship" required placeholder="e.g. Sister"></div><div class="form-group"><label>Phone number</label><input id="phone" required></div><div class="form-group"><label>Email address</label><input id="email" type="email" required></div><div id="message" class="message"></div><div class="button-row"><button class="primary" type="submit">Save Contact</button><button class="secondary" type="button" id="cancelBtn">Cancel</button></div></form></section></main><script src="api.js"></script><script src="contacts.js"></script></body></html>
